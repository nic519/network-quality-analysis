name: Build App On Tag

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  verify:
    name: Verify project
    runs-on: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      - name: Run typecheck
        run: bun run typecheck

  build:
    name: Build on ${{ matrix.label }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macOS
            asset_suffix: macos-arm64
          - os: windows-latest
            label: Windows
            asset_suffix: windows-x64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build app
        run: bun run build

      - name: Verify packaged app starts
        run: bun run verify:app

      - name: Package macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p release-assets
          BUILD_DIR="$(find build -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          APP_PATH="$(find "$BUILD_DIR" -mindepth 1 -maxdepth 1 -name '*.app' | head -n 1)"
          ASSET_NAME="latency-compass-${GITHUB_REF_NAME}-${{ matrix.asset_suffix }}.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "release-assets/$ASSET_NAME"

      - name: Package Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $artifact = Get-ChildItem artifacts -File -Filter '*.zip' | Select-Object -First 1
          if (-not $artifact) {
            throw "No Windows zip artifact found under artifacts/"
          }
          $assetName = "latency-compass-${env:GITHUB_REF_NAME}-${{ matrix.asset_suffix }}.zip"
          Copy-Item -Path $artifact.FullName -Destination "release-assets\$assetName"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: latency-compass-${{ github.ref_name }}-${{ matrix.asset_suffix }}
          path: release-assets/*.zip
          if-no-files-found: error

  release:
    name: Publish release assets
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.zip
